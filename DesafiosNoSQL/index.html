                    </div>
                    <div class="p-4 rounded-2xl bg-indigo-500/10 dark:bg-white/[0.07] border border-indigo-500/20 dark:border-white/10 space-y-3">
                        <p class="font-bold text-slate-900 dark:text-white">Ejemplo:</p>
                        <div class="flex flex-wrap items-center justify-center gap-2 text-center">
                            <span class="px-3.5 py-1.5 rounded-full bg-white/80 dark:bg-white/15 border border-indigo-500/20 dark:border-white/15 text-xs sm:text-sm font-semibold text-slate-900 dark:text-white shadow-sm">
                                Datos de usuarios
                            </span>
                            <span class="text-indigo-600 dark:text-indigo-300 font-bold text-base">&rarr;</span>
                            <span class="px-3.5 py-1.5 rounded-full bg-white/80 dark:bg-white/15 border border-indigo-500/20 dark:border-white/15 text-xs sm:text-sm font-semibold text-slate-900 dark:text-white shadow-sm">
                                MongoDB
                            </span>
                            <span class="text-indigo-600 dark:text-indigo-300 font-bold text-base">&rarr;</span>
                            <span class="px-3.5 py-1.5 rounded-full bg-gradient-to-br from-[#584BB5] to-[#483C9A] text-white text-xs sm:text-sm font-semibold shadow-sm">
                                análisis en Spark
                            </span>
                        </div>
                    </div>
                `
            }
        };

        // Referencias al DOM
        const backdrop = document.getElementById('ios-modal-backdrop');
        const modalCard = document.getElementById('ios-modal-card');
        const modalBadge = document.getElementById('modal-badge');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const stepDots = document.querySelectorAll('.step-dot');

        let activeCardId = null;

        /**
         * Abre la ventana emergente con animación elástica estilo iOS 27
         * @param {number} cardId - Identificador de la tarjeta (1 a 3)
         */
        function openCardModal(cardId) {
            const data = CARDS_DATA[cardId];
            if (!data) return;

            const isAlreadyOpen = !backdrop.classList.contains('hidden');
            activeCardId = cardId;

            // Actualizar contenido del modal
            modalBadge.textContent = data.number;
            modalTitle.textContent = data.title;
            modalBody.innerHTML = data.contentHTML;

            // Actualizar indicadores de paso en el pie del modal
            stepDots.forEach(dot => {
                const stepNum = Number(dot.dataset.step);
                if (stepNum === cardId) {
                    dot.className = "step-dot px-3 py-1.5 rounded-full text-xs font-bold bg-gradient-to-br from-[#584BB5] to-[#483C9A] text-white shadow-md scale-105 transition-all duration-300 cursor-pointer";
                } else {
                    dot.className = "step-dot px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-900/10 dark:bg-white/10 hover:bg-slate-900/20 dark:hover:bg-white/20 opacity-75 transition-all duration-300 cursor-pointer";
                }
            });

            if (!isAlreadyOpen) {
                backdrop.classList.remove('hidden');
                backdrop.classList.add('flex');
                // Forzar reflow para disparar transición CSS suave
                void backdrop.offsetWidth;
                backdrop.classList.remove('opacity-0');
                modalCard.classList.remove('scale-90', 'translate-y-6', 'opacity-0');
                modalCard.classList.add('scale-100', 'translate-y-0', 'opacity-100');
            } else {
                // Micro-animación de pulso al cambiar directamente entre tarjetas dentro del modal
                modalCard.classList.add('scale-[0.98]');
                setTimeout(() => {
                    modalCard.classList.remove('scale-[0.98]');
                }, 140);
            }
        }

        /**
         * Cierra la ventana emergente con animación suave estilo iOS 27
         */
        function closeCardModal() {
            if (backdrop.classList.contains('hidden')) return;

            backdrop.classList.add('opacity-0');
            modalCard.classList.remove('scale-100', 'translate-y-0', 'opacity-100');
            modalCard.classList.add('scale-90', 'translate-y-6', 'opacity-0');

            setTimeout(() => {
                backdrop.classList.add('hidden');
                backdrop.classList.remove('flex');
                activeCardId = null;
            }, 300);
        }

        /**
         * Navega a la tarjeta anterior (-1) o siguiente (+1) de forma circular
         * @param {number} direction - Dirección de navegación (-1 o 1)
         */
        function navigateModal(direction) {
            if (!activeCardId) return;
            const total = 3;
            const targetId = ((activeCardId - 1 + direction + total) % total) + 1;
            openCardModal(targetId);
        }

        // Cerrar al hacer clic fuera de la tarjeta modal
        backdrop.addEventListener('click', (event) => {
            if (event.target === backdrop) {
                closeCardModal();
            }
        });

        // Soporte de teclado: Escape para cerrar y flechas izquierda/derecha para navegar entre las 3 tarjetas
        document.addEventListener('keydown', (event) => {
            if (backdrop.classList.contains('hidden')) return;

            if (event.key === 'Escape') {
                closeCardModal();
            } else if (event.key === 'ArrowRight' && activeCardId) {
                navigateModal(1);
            } else if (event.key === 'ArrowLeft' && activeCardId) {
                navigateModal(-1);
            }
        });

        // =====================================================================
        // Alternar Modo Claro / Modo Oscuro estilo iOS 27
        // =====================================================================
        const themeToggle = document.getElementById('theme-toggle');
        const htmlEl = document.documentElement;
        const bodyEl = document.getElementById('app-body');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');

        themeToggle.addEventListener('click', () => {
            const isDark = htmlEl.classList.toggle('dark');

            if (isDark) {
                bodyEl.classList.remove('bg-slate-100', 'text-slate-900');
                bodyEl.classList.add('bg-slate-950', 'text-white');
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            } else {
                bodyEl.classList.remove('bg-slate-950', 'text-white');
                bodyEl.classList.add('bg-slate-100', 'text-slate-900');
                iconMoon.classList.add('hidden');
                iconSun.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
