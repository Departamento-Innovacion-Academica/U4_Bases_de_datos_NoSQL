<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas Distribuidos · iOS 27 Liquid Glass</title>
    <!-- Tailwind CSS -->

    <!-- Google Fonts: Poppins & Inter (Estilo SF Pro / iOS) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        tailwind.config = {

                        sans: ['Poppins', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Inter', 'sans-serif'],
                    },
                    transitionTimingFunction: {
                        'ios-spring': 'cubic-bezier(0.22, 1.35, 0.36, 1)',
                        'ios-smooth': 'cubic-bezier(0.16, 1, 0.3, 1)',

        }
    </script>
</head>
<body class="font-sans antialiased min-h-screen w-full overflow-x-hidden relative flex flex-col justify-between selection:bg-indigo-500/30 transition-colors duration-700 bg-slate-950 text-white" id="app-body">

    <!-- Fondo Ambiental estilo Wallpaper Dinámico iOS 27 -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <!-- Orbes luminosos suaves con desenfoque profundo -->
        <div id="orb-1" class="absolute -top-[15%] -left-[10%] w-[55vw] h-[55vw] max-w-[700px] max-h-[700px] rounded-full bg-indigo-600/35 dark:bg-indigo-600/30 blur-[120px] transition-all duration-1000"></div>
        <div id="orb-2" class="absolute top-[25%] -right-[10%] w-[50vw] h-[50vw] max-w-[650px] max-h-[650px] rounded-full bg-sky-500/30 dark:bg-cyan-500/20 blur-[130px] transition-all duration-1000"></div>
        <div id="orb-3" class="absolute -bottom-[20%] left-[20%] w-[60vw] h-[60vw] max-w-[750px] max-h-[750px] rounded-full bg-purple-600/30 dark:bg-violet-600/25 blur-[140px] transition-all duration-1000"></div>
        <!-- Malla de ruido sutil para textura óptica de cristal -->
        <div class="absolute inset-0 bg-[radial-gradient(rgba(255,255,255,0.06)_1px,transparent_1px)] [background-size:24px_24px] opacity-40"></div>
    </div>

    <!-- Barra Superior con Dynamic Island (Notch iOS 27) y Selector de Tema -->
    <header class="w-full pt-5 px-4 sm:px-10 relative flex items-center justify-center z-20 min-h-[60px]">
        <!-- Dynamic Island Interactiva con la instrucción centrada -->
        <div class="flex items-center justify-center gap-2.5 px-5 py-2.5 rounded-full bg-black/80 dark:bg-black/85 backdrop-blur-2xl border border-white/15 shadow-[0_10px_35px_rgba(0,0,0,0.45),inset_0_1px_0_rgba(255,255,255,0.22)] text-white text-xs sm:text-[13px] font-medium tracking-wide transition-all duration-500 hover:scale-[1.02] cursor-default max-w-[90vw] text-center">
            <span class="relative flex h-2 w-2 shrink-0">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-400"></span>
            </span>
            <span class="leading-snug">Haga clic sobre cada tarjeta para ampliar la información.</span>
        </div>

        <!-- Botón discreto de cambio de apariencia (Modo Claro / Modo Oscuro iOS) -->
        <button id="theme-toggle" aria-label="Cambiar apariencia" title="Cambiar entre modo claro y oscuro" class="sm:absolute sm:right-10 ml-2.5 sm:ml-0 shrink-0 group flex items-center justify-center w-9 h-9 rounded-full bg-white/20 dark:bg-white/10 hover:bg-white/30 dark:hover:bg-white/20 backdrop-blur-2xl border border-white/30 dark:border-white/15 shadow-[0_4px_20px_rgba(0,0,0,0.12),inset_0_1px_0_rgba(255,255,255,0.3)] active:scale-90 transition-all duration-300 ease-ios-spring cursor-pointer">
            <!-- Icono Sol -->
            <svg id="icon-sun" class="w-4 h-4 text-amber-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <!-- Icono Luna -->

            </svg>

        <!-- Contenedor Dock / Centro de Control Liquid Glass con las 4 Tarjetas-Botón lado a lado -->
        <section aria-label="Tarjetas de conceptos" class="w-full p-3 sm:p-5 rounded-[36px] sm:rounded-[44px] bg-white/25 dark:bg-white/[0.06] backdrop-blur-3xl border border-white/40 dark:border-white/15 shadow-[0_25px_70px_-15px_rgba(0,0,0,0.35),inset_0_1px_1px_rgba(255,255,255,0.5)] dark:shadow-[0_25px_70px_-15px_rgba(0,0,0,0.65),inset_0_1px_1px_rgba(255,255,255,0.2)] transition-all duration-500">

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-4 w-full" id="cards-grid">
                
                <!-- TARJETA / BOTÓN 1: Escalabilidad -->
                <button type="button" onclick="openCardModal(1)" class="ios-glass-card group relative text-left flex flex-col justify-between p-6 sm:p-7 rounded-[28px] sm:rounded-[32px] bg-white/50 dark:bg-white/[0.08] hover:bg-white/70 dark:hover:bg-white/[0.14] backdrop-blur-2xl border border-white/60 dark:border-white/15 shadow-[0_10px_30px_rgba(0,0,0,0.08),inset_0_1px_1px_rgba(255,255,255,0.7)] dark:shadow-[0_12px_32px_rgba(0,0,0,0.35),inset_0_1px_1px_rgba(255,255,255,0.25)] transition-all duration-500 ease-ios-spring hover:-translate-y-1.5 hover:scale-[1.02] active:scale-[0.96] cursor-pointer overflow-hidden focus:outline-none focus:ring-2 focus:ring-indigo-400/70">
                    <!-- Reflejo Especular Superior (Liquid Glass Highlight) -->
                    <div class="absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-white/40 dark:from-white/10 to-transparent pointer-events-none opacity-80 group-hover:opacity-100 transition-opacity"></div>
                    
                    <div class="relative z-10 flex items-center justify-between w-full mb-8">
                        <!-- Insignia Numérica estilo iOS -->
                        <span class="w-11 h-11 rounded-full bg-indigo-600 dark:bg-indigo-500 text-white font-bold text-lg flex items-center justify-center shadow-[0_6px_16px_rgba(79,70,229,0.45),inset_0_1px_1px_rgba(255,255,255,0.5)] group-hover:scale-110 transition-transform duration-500 ease-ios-spring">

                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">

                            </svg>

                            </svg>

                <!-- TARJETA / BOTÓN 2: Alta disponibilidad -->
                <button type="button" onclick="openCardModal(2)" class="ios-glass-card group relative text-left flex flex-col justify-between p-6 sm:p-7 rounded-[28px] sm:rounded-[32px] bg-white/50 dark:bg-white/[0.08] hover:bg-white/70 dark:hover:bg-white/[0.14] backdrop-blur-2xl border border-white/60 dark:border-white/15 shadow-[0_10px_30px_rgba(0,0,0,0.08),inset_0_1px_1px_rgba(255,255,255,0.7)] dark:shadow-[0_12px_32px_rgba(0,0,0,0.35),inset_0_1px_1px_rgba(255,255,255,0.25)] transition-all duration-500 ease-ios-spring hover:-translate-y-1.5 hover:scale-[1.02] active:scale-[0.96] cursor-pointer overflow-hidden focus:outline-none focus:ring-2 focus:ring-indigo-400/70">
                    <div class="absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-white/40 dark:from-white/10 to-transparent pointer-events-none opacity-80 group-hover:opacity-100 transition-opacity"></div>
                    
                    <div class="relative z-10 flex items-center justify-between w-full mb-8">
                        <span class="w-11 h-11 rounded-full bg-indigo-600 dark:bg-indigo-500 text-white font-bold text-lg flex items-center justify-center shadow-[0_6px_16px_rgba(79,70,229,0.45),inset_0_1px_1px_rgba(255,255,255,0.5)] group-hover:scale-110 transition-transform duration-500 ease-ios-spring">
                            2
                        </span>
                        <span class="w-9 h-9 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center opacity-75 group-hover:opacity-100 group-hover:rotate-12 transition-all duration-300">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                        </span>
                    </div>

                    <div class="relative z-10">
                        <h2 class="text-lg sm:text-xl font-bold tracking-tight mb-1.5">Alta disponibilidad</h2>
                        <p class="text-xs sm:text-sm opacity-70 line-clamp-2 leading-relaxed">
                            Continuidad operativa ante fallos de nodos individuales.
                        </p>
                        <div class="mt-5 inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-300 group-hover:translate-x-1 transition-transform">
                            <span>Ver detalles</span>
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                            </svg>
                        </div>
                    </div>
                </button>

                <!-- TARJETA / BOTÓN 3: Procesamiento paralelo -->
                <button type="button" onclick="openCardModal(3)" class="ios-glass-card group relative text-left flex flex-col justify-between p-6 sm:p-7 rounded-[28px] sm:rounded-[32px] bg-white/50 dark:bg-white/[0.08] hover:bg-white/70 dark:hover:bg-white/[0.14] backdrop-blur-2xl border border-white/60 dark:border-white/15 shadow-[0_10px_30px_rgba(0,0,0,0.08),inset_0_1px_1px_rgba(255,255,255,0.7)] dark:shadow-[0_12px_32px_rgba(0,0,0,0.35),inset_0_1px_1px_rgba(255,255,255,0.25)] transition-all duration-500 ease-ios-spring hover:-translate-y-1.5 hover:scale-[1.02] active:scale-[0.96] cursor-pointer overflow-hidden focus:outline-none focus:ring-2 focus:ring-indigo-400/70">
                    <div class="absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-white/40 dark:from-white/10 to-transparent pointer-events-none opacity-80 group-hover:opacity-100 transition-opacity"></div>
                    
                    <div class="relative z-10 flex items-center justify-between w-full mb-8">
                        <span class="w-11 h-11 rounded-full bg-indigo-600 dark:bg-indigo-500 text-white font-bold text-lg flex items-center justify-center shadow-[0_6px_16px_rgba(79,70,229,0.45),inset_0_1px_1px_rgba(255,255,255,0.5)] group-hover:scale-110 transition-transform duration-500 ease-ios-spring">
                            3
                        </span>
                        <span class="w-9 h-9 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center opacity-75 group-hover:opacity-100 group-hover:rotate-12 transition-all duration-300">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                            </svg>
                        </span>
                    </div>

                    <div class="relative z-10">
                        <h2 class="text-lg sm:text-xl font-bold tracking-tight mb-1.5">Procesamiento paralelo</h2>
                        <p class="text-xs sm:text-sm opacity-70 line-clamp-2 leading-relaxed">
                            División inteligente de tareas entre múltiples nodos.
                        </p>
                        <div class="mt-5 inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-300 group-hover:translate-x-1 transition-transform">
                            <span>Ver detalles</span>
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                            </svg>
                        </div>
                    </div>
                </button>

                <!-- TARJETA / BOTÓN 4: Distribución geográfica -->
                <button type="button" onclick="openCardModal(4)" class="ios-glass-card group relative text-left flex flex-col justify-between p-6 sm:p-7 rounded-[28px] sm:rounded-[32px] bg-white/50 dark:bg-white/[0.08] hover:bg-white/70 dark:hover:bg-white/[0.14] backdrop-blur-2xl border border-white/60 dark:border-white/15 shadow-[0_10px_30px_rgba(0,0,0,0.08),inset_0_1px_1px_rgba(255,255,255,0.7)] dark:shadow-[0_12px_32px_rgba(0,0,0,0.35),inset_0_1px_1px_rgba(255,255,255,0.25)] transition-all duration-500 ease-ios-spring hover:-translate-y-1.5 hover:scale-[1.02] active:scale-[0.96] cursor-pointer overflow-hidden focus:outline-none focus:ring-2 focus:ring-indigo-400/70">
                    <div class="absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-white/40 dark:from-white/10 to-transparent pointer-events-none opacity-80 group-hover:opacity-100 transition-opacity"></div>
                    
                    <div class="relative z-10 flex items-center justify-between w-full mb-8">
                        <span class="w-11 h-11 rounded-full bg-indigo-600 dark:bg-indigo-500 text-white font-bold text-lg flex items-center justify-center shadow-[0_6px_16px_rgba(79,70,229,0.45),inset_0_1px_1px_rgba(255,255,255,0.5)] group-hover:scale-110 transition-transform duration-500 ease-ios-spring">
                            4
                        </span>
                        <span class="w-9 h-9 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center opacity-75 group-hover:opacity-100 group-hover:rotate-12 transition-all duration-300">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </span>
                    </div>

                    <div class="relative z-10">
                        <h2 class="text-lg sm:text-xl font-bold tracking-tight mb-1.5">Distribución geográfica</h2>
                        <p class="text-xs sm:text-sm opacity-70 line-clamp-2 leading-relaxed">
                            Proximidad de datos al usuario para reducir la latencia.
                        </p>
                        <div class="mt-5 inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-300 group-hover:translate-x-1 transition-transform">
                            <span>Ver detalles</span>
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                            </svg>
                        </div>

            </div>

    <!-- Indicador Home Bar estilo iOS 27 en la parte inferior -->
    <footer class="w-full pb-4 pt-2 flex flex-col items-center justify-center z-10">
        <div class="w-32 h-1.5 rounded-full bg-current opacity-30"></div>
    </footer>

    <!-- ===================================================================== -->
    <!-- VENTANA EMERGENTE (MODAL / SHEET ESTILO iOS 27 LIQUID GLASS)          -->
    <!-- ===================================================================== -->
    <div id="ios-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 bg-black/45 dark:bg-black/65 backdrop-blur-xl opacity-0 transition-opacity duration-300 ease-ios-smooth">
        
        <!-- Contenedor Principal del Modal Cristalino -->
        <div id="ios-modal-card" class="relative w-full max-w-lg rounded-[36px] sm:rounded-[42px] bg-white/80 dark:bg-slate-900/75 backdrop-blur-3xl border border-white/70 dark:border-white/20 shadow-[0_32px_90px_rgba(0,0,0,0.45),inset_0_1px_1px_rgba(255,255,255,0.8)] dark:shadow-[0_32px_90px_rgba(0,0,0,0.8),inset_0_1px_1px_rgba(255,255,255,0.25)] p-7 sm:p-9 text-slate-900 dark:text-white transform scale-90 translate-y-6 opacity-0 transition-all duration-500 ease-ios-spring overflow-hidden">
            
            <!-- Brillo especular superior -->
            <div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-white/50 dark:from-white/10 to-transparent pointer-events-none"></div>

            <!-- Grabber pill superior estilo iOS Sheet -->
            <div class="w-10 h-1 rounded-full bg-slate-400/50 dark:bg-white/25 mx-auto mb-6"></div>

            <!-- Cabecera del Modal: Número + Título + Botón Cerrar -->
            <div class="relative z-10 flex items-start justify-between gap-4 mb-6">
                <div class="flex items-center gap-4">
                    <div id="modal-badge" class="w-13 h-13 min-w-[52px] min-h-[52px] rounded-full bg-indigo-600 dark:bg-indigo-500 text-white font-bold text-xl flex items-center justify-center shadow-[0_8px_24px_rgba(79,70,229,0.5),inset_0_1px_1px_rgba(255,255,255,0.5)]">
                        1
                    </div>
                    <div>
                        <span class="text-[11px] font-semibold uppercase tracking-widest text-indigo-600 dark:text-indigo-300 block mb-0.5">Concepto Clave</span>
                        <h3 id="modal-title" class="text-2xl sm:text-[26px] font-bold tracking-tight leading-tight">
                            Escalabilidad:
                        </h3>
                    </div>
                </div>

                <!-- Botón Cerrar Circular estilo iOS -->
                <button type="button" onclick="closeCardModal()" aria-label="Cerrar ventana" class="w-9 h-9 min-w-[36px] rounded-full bg-slate-900/10 dark:bg-white/15 hover:bg-slate-900/20 dark:hover:bg-white/25 flex items-center justify-center transition-all duration-200 active:scale-90 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Cuerpo del Contenido Exacto de la Imagen -->
            <div id="modal-body" class="relative z-10 space-y-4 text-[15px] sm:text-base leading-relaxed text-slate-700 dark:text-slate-200">
                <!-- Se rellena dinámicamente mediante JavaScript -->
            </div>

            <!-- Pie de Modal con Navegación Rápida entre Tarjetas y Botón Listo -->
            <div class="relative z-10 mt-8 pt-5 border-t border-slate-900/10 dark:border-white/10 flex items-center justify-between gap-3">
                <!-- Selector rápido de 1 a 4 -->
                <div class="flex items-center gap-1.5" id="modal-stepper">
                    <button type="button" onclick="openCardModal(1)" data-step="1" class="step-dot w-8 h-8 rounded-full text-xs font-bold transition-all duration-300 cursor-pointer">1</button>
                    <button type="button" onclick="openCardModal(2)" data-step="2" class="step-dot w-8 h-8 rounded-full text-xs font-bold transition-all duration-300 cursor-pointer">2</button>
                    <button type="button" onclick="openCardModal(3)" data-step="3" class="step-dot w-8 h-8 rounded-full text-xs font-bold transition-all duration-300 cursor-pointer">3</button>
                    <button type="button" onclick="openCardModal(4)" data-step="4" class="step-dot w-8 h-8 rounded-full text-xs font-bold transition-all duration-300 cursor-pointer">4</button>
                </div>

    <!-- Lógica Interactiva y Gestión de Modales -->
    <script>
        /**
         * Base de datos con el contenido exacto de las 4 tarjetas de la imagen
         */
        const CARDS_DATA = {
            1: {
                number: "1",
                title: "Escalabilidad:",
                contentHTML: `
                    <p class="font-normal">Esto permite crecer progresivamente sin rediseñar la solución.</p>
                    <div class="p-4 rounded-2xl bg-indigo-500/10 dark:bg-white/[0.07] border border-indigo-500/20 dark:border-white/10 font-medium text-slate-900 dark:text-white tracking-tight">
                        + nodos &rarr; + capacidad &rarr; + usuarios soportados
                    </div>
                `
            },
            2: {
                number: "2",
                title: "Alta disponibilidad:",
                contentHTML: `
                    <p class="font-normal">Si un nodo falla, otros pueden continuar prestando servicio.</p>
                    <div class="p-4 rounded-2xl bg-indigo-500/10 dark:bg-white/[0.07] border border-indigo-500/20 dark:border-white/10 font-medium text-slate-900 dark:text-white tracking-tight">
                        Nodo A falla &rarr; Nodo B responde
                    </div>
                    <p class="font-normal">Esto reduce interrupciones en aplicaciones críticas.</p>
                `
            },
            3: {
                number: "3",
                title: "Procesamiento paralelo:",
                contentHTML: `
                    <p class="font-normal">Las tareas pueden dividirse entre múltiples nodos.</p>
                    <div class="p-4 rounded-2xl bg-indigo-500/10 dark:bg-white/[0.07] border border-indigo-500/20 dark:border-white/10 space-y-2">
                        <p class="font-semibold text-slate-900 dark:text-white">Ejemplo:</p>
                        <ul class="list-disc pl-5 space-y-1.5 text-slate-800 dark:text-slate-100">
                            <li>Consultas distribuidas</li>
                            <li>Análisis de datos</li>
                            <li>Procesamiento masivo</li>
                        </ul>
                    </div>
                    <p class="font-normal">Esto mejora significativamente los tiempos de respuesta.</p>
                `
            },
            4: {
                number: "4",
                title: "Distribución geográfica:",
                contentHTML: `
                    <p class="font-normal">Los datos pueden ubicarse cerca del usuario final.</p>
                    <div class="p-4 rounded-2xl bg-indigo-500/10 dark:bg-white/[0.07] border border-indigo-500/20 dark:border-white/10 space-y-2 font-medium text-slate-900 dark:text-white">
                        <p>Usuario Colombia &rarr; nodo cercano</p>
                        <p>Usuario Europa &rarr; nodo local</p>
                    </div>
                    <p class="font-normal">Esto reduce latencia.</p>
                `
            }
        };

        // Referencias al DOM
        const backdrop = document.getElementById('ios-modal-backdrop');
        const modalCard = document.getElementById('ios-modal-card');
        const modalBadge = document.getElementById('modal-badge');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const stepDots = document.querySelectorAll('.step-dot');

        let activeCardId = null;

        /**
         * Abre la ventana emergente con animación elástica estilo iOS 27
         * @param {number} cardId - Identificador de la tarjeta (1 a 4)
         */
        function openCardModal(cardId) {
            const data = CARDS_DATA[cardId];
            if (!data) return;

            const isAlreadyOpen = !backdrop.classList.contains('hidden');
            activeCardId = cardId;

            // Actualizar contenido del modal
            modalBadge.textContent = data.number;
            modalTitle.textContent = data.title;
            modalBody.innerHTML = data.contentHTML;

            // Actualizar indicadores de paso en el pie del modal
            stepDots.forEach(dot => {
                const stepNum = Number(dot.dataset.step);
                if (stepNum === cardId) {
                    dot.className = "step-dot w-8 h-8 rounded-full text-xs font-bold bg-indigo-600 dark:bg-indigo-500 text-white shadow-md scale-110 transition-all duration-300 cursor-pointer";
                } else {
                    dot.className = "step-dot w-8 h-8 rounded-full text-xs font-semibold bg-slate-900/10 dark:bg-white/10 hover:bg-slate-900/20 dark:hover:bg-white/20 opacity-75 transition-all duration-300 cursor-pointer";
                }
            });

            if (!isAlreadyOpen) {
                backdrop.classList.remove('hidden');
                backdrop.classList.add('flex');
                // Forzar reflow para disparar transición CSS suave
                void backdrop.offsetWidth;
                backdrop.classList.remove('opacity-0');
                modalCard.classList.remove('scale-90', 'translate-y-6', 'opacity-0');
                modalCard.classList.add('scale-100', 'translate-y-0', 'opacity-100');
            } else {
                // Micro-animación de pulso al cambiar directamente entre tarjetas dentro del modal
                modalCard.classList.add('scale-[0.98]');
                setTimeout(() => {
                    modalCard.classList.remove('scale-[0.98]');
                }, 140);
            }
        }

        /**
         * Cierra la ventana emergente con suavidad
         */
        function closeCardModal() {
            if (backdrop.classList.contains('hidden')) return;

            backdrop.classList.add('opacity-0');
            modalCard.classList.remove('scale-100', 'translate-y-0', 'opacity-100');
            modalCard.classList.add('scale-90', 'translate-y-6', 'opacity-0');

            setTimeout(() => {
                backdrop.classList.add('hidden');
                backdrop.classList.remove('flex');
                activeCardId = null;
            }, 300);
        }

        // Cerrar al hacer clic fuera de la tarjeta modal
        backdrop.addEventListener('click', (event) => {
            if (event.target === backdrop) {
                closeCardModal();
            }
        });

        // Soporte de teclado: Escape para cerrar y flechas izquierda/derecha para navegar
        document.addEventListener('keydown', (event) => {
            if (backdrop.classList.contains('hidden')) return;

            if (event.key === 'Escape') {
                closeCardModal();
            } else if (event.key === 'ArrowRight' && activeCardId) {
                const next = activeCardId < 4 ? activeCardId + 1 : 1;
                openCardModal(next);
            } else if (event.key === 'ArrowLeft' && activeCardId) {
                const prev = activeCardId > 1 ? activeCardId - 1 : 4;
                openCardModal(prev);
            }
        });

        // =====================================================================
        // Alternar Modo Claro / Modo Oscuro estilo iOS 27
        // =====================================================================
        const themeToggle = document.getElementById('theme-toggle');
        const htmlEl = document.documentElement;
        const bodyEl = document.getElementById('app-body');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');

        themeToggle.addEventListener('click', () => {
            const isDark = htmlEl.classList.toggle('dark');

            if (isDark) {
                bodyEl.classList.remove('bg-slate-100', 'text-slate-900');
                bodyEl.classList.add('bg-slate-950', 'text-white');
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            } else {
                bodyEl.classList.remove('bg-slate-950', 'text-white');
                bodyEl.classList.add('bg-slate-100', 'text-slate-900');
                iconMoon.classList.add('hidden');
                iconSun.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
