<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicación Distribuida - Animada</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at center, #eef2f6 0%, #cfd8e3 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Instrucción flotante en la esquina superior derecha */
    .floating-hint {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #ffffff;
      color: #1e293b;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
      border: 1px solid #cbd5e1;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: hintFloat 3s ease-in-out infinite;
    }

    .floating-hint strong {
      font-weight: 700;
      color: #0f172a;
    }

    @keyframes hintFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Barra de controles superior */
    .controls {
      margin-bottom: 18px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .btn-play {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .btn-play:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 25px rgba(15, 23, 42, 0.35);
    }

    .btn-play:active {
      transform: scale(0.97);
    }

    /* Tarjeta Principal */
    .card {
      background-color: #f4f4f4;
      border-radius: 18px;
      padding: 36px 40px 44px;
      max-width: 980px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.14);
      border: 1px solid #d1d5db;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Estado inicial oculto antes de animar */
    .anim-item {
      opacity: 0;
    }

    /* Animaciones Keyframes */
    @keyframes dropTitle {
      0% { opacity: 0; transform: translateY(-35px) scale(0.9); filter: blur(6px); }
      70% { opacity: 1; transform: translateY(4px) scale(1.02); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(25px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes hexPopIn {
      0% { opacity: 0; transform: scale(0.2) rotate(-25deg); }
      65% { opacity: 1; transform: scale(1.08) rotate(3deg); }
      85% { transform: scale(0.97) rotate(-1deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes drawHexBorder {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes packetFly {
      0% { opacity: 0; transform: translateX(-35px) scale(0.4) rotate(-15deg); }
      60% { opacity: 1; transform: translateX(6px) scale(1.15) rotate(4deg); }
      100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
    }

    @keyframes arrowStretch {
      0% { opacity: 0; transform: scaleX(0); }
      70% { opacity: 1; transform: scaleX(1.12); }
      100% { opacity: 1; transform: scaleX(1); }
    }

    @keyframes pulseGlowBlue {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(91, 139, 224, 0)); }
      50% { filter: drop-shadow(0 0 14px rgba(91, 139, 224, 0.7)); }
    }

    @keyframes pulseGlowOrange {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(217, 138, 60, 0)); }
      50% { filter: drop-shadow(0 0 14px rgba(217, 138, 60, 0.7)); }
    }

    @keyframes pulseGlowGreen {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(58, 158, 70, 0)); }
      50% { filter: drop-shadow(0 0 14px rgba(58, 158, 70, 0.7)); }
    }

    @keyframes ledBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    @keyframes floatDoc {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    /* Clases activadas por JS */
    .play .title {
      animation: dropTitle 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .play .subtitle {
      animation: fadeSlideUp 0.6s ease-out 0.25s forwards;
    }

    /* Nodo A */
    .play .node-a .hexagon-wrapper {
      animation: hexPopIn 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s forwards,
                 pulseGlowBlue 2.5s ease-in-out 1.4s infinite;
    }
    .play .node-a .hex-stroke {
      stroke-dasharray: 800;
      animation: drawHexBorder 0.9s ease-out 0.55s forwards;
    }
    .play .node-a .desc-box {
      animation: fadeSlideUp 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.85s forwards;
    }

    /* Conector 1 */
    .play .conn-1 .doc-icon {
      animation: packetFly 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1.25s forwards,
                 floatDoc 2.2s ease-in-out 1.9s infinite;
    }
    .play .conn-1 .arrow-icon {
      animation: arrowStretch 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.35s forwards;
    }

    /* Nodo B */
    .play .node-b .hexagon-wrapper {
      animation: hexPopIn 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) 1.65s forwards,
                 pulseGlowOrange 2.5s ease-in-out 2.5s infinite;
    }
    .play .node-b .hex-stroke {
      stroke-dasharray: 800;
      animation: drawHexBorder 0.9s ease-out 1.65s forwards;
    }
    .play .node-b .desc-box {
      animation: fadeSlideUp 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 1.95s forwards;
    }

    /* Conector 2 */
    .play .conn-2 .doc-icon {
      animation: packetFly 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 2.35s forwards,
                 floatDoc 2.2s ease-in-out 3s infinite;
    }
    .play .conn-2 .arrow-icon {
      animation: arrowStretch 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 2.45s forwards;
    }

    /* Nodo C */
    .play .node-c .hexagon-wrapper {
      animation: hexPopIn 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) 2.75s forwards,
                 pulseGlowGreen 2.5s ease-in-out 3.6s infinite;
    }
    .play .node-c .hex-stroke {
      stroke-dasharray: 800;
      animation: drawHexBorder 0.9s ease-out 2.75s forwards;
    }
    .play .node-c .desc-box {
      animation: fadeSlideUp 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 3.05s forwards;
    }

    .led-dot {
      transform-origin: center;
      animation: ledBlink 1.4s infinite ease-in-out;
    }

    /* Estilos estructurales */
    .title {
      font-size: 32px;
      font-weight: 800;
      color: #0a0a0a;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 16px;
      font-weight: 400;
      color: #111111;
      margin-bottom: 24px;
    }

    .subtitle span {
      font-size: 18px;
    }

    .diagram {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .node-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .hexagon-wrapper {
      position: relative;
      width: 245px;
      height: 275px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .hexagon-wrapper:hover {
      transform: scale(1.06) !important;
    }

    .hexagon-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .node-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 8px;
    }

    .server-icon {
      width: 64px;
      height: 82px;
      margin-bottom: 14px;
    }

    .node-label {
      font-size: 28px;
      font-weight: 800;
      color: #050505;
      letter-spacing: 0.5px;
    }

    .desc-box {
      width: 195px;
      min-height: 76px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      line-height: 1.25;
      color: #111111;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .desc-box strong {
      font-weight: 700;
      font-size: 15px;
    }

    .box-a { background-color: #d7e3f5; }
    .box-b { background-color: #efd4b8; }
    .box-c { background-color: #c8edd1; }

    .connector {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 92px;
      min-width: 72px;
    }

    .doc-icon {
      width: 34px;
      height: 42px;
      margin-bottom: 6px;
    }

    .arrow-icon {
      width: 68px;
      height: 24px;
    }

    @media (max-width: 860px) {
      .floating-hint {
        position: static;
        margin-bottom: 12px;
        text-align: center;
      }
      .diagram {
        flex-direction: column;
        align-items: center;
      }
      .connector {
        margin: 15px 0;
        transform: rotate(90deg);
      }
    }
  </style>
</head>
<body>

  <!-- Instrucción flotante superior derecha -->
  <div class="floating-hint">
    💡 Haga clic en el botón <strong>"Reproducir Animación y Sonido"</strong> para reiniciar la animación.
  </div>

  <div class="controls">
    <button class="btn-play" id="replayBtn">
      <span>🔊</span> Reproducir Animación y Sonido
    </button>
  </div>

  <div class="card" id="scene">
    <h1 class="title anim-item">COMUNICACIÓN DISTRIBUIDA</h1>
    <p class="subtitle anim-item">ARQUITECTURA DE RED <span>(Nodo A ↔ Nodo B ↔ Nodo C)</span></p>

    <div class="diagram">
      
      <!-- NODO A -->
      <div class="node-column node-a">
        <div class="hexagon-wrapper anim-item" onclick="playNodeTone(523.25)">
          <svg class="hexagon-bg" viewBox="0 0 240 270">
            <polygon class="hex-stroke"
                     points="120,8 228,70 228,200 120,262 12,200 12,70"
                     fill="#ffffff"
                     stroke="#5b8be0"
                     stroke-width="8"
                     stroke-linejoin="round" />
          </svg>
          <div class="node-content">
            <svg class="server-icon" viewBox="0 0 64 82">
              <rect x="4" y="2" width="56" height="78" rx="6" fill="#636b70"/>
              <rect x="11" y="10" width="42" height="14" rx="2" fill="#464d52"/>
              <line x1="15" y1="17" x2="49" y2="17" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
              <rect x="11" y="29" width="42" height="14" rx="2" fill="#464d52"/>
              <line x1="15" y1="36" x2="49" y2="36" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
              <circle class="led-dot" cx="32" cy="61" r="6" fill="#4ade38"/>
            </svg>
            <div class="node-label">NODO A</div>
          </div>
        </div>
        <div class="desc-box box-a anim-item">
          <strong>NODO A:</strong>
          <span>INICIO/EMISOR</span>
        </div>
      </div>

      <!-- CONECTOR 1 -->
      <div class="connector conn-1">
        <svg class="doc-icon anim-item" viewBox="0 0 36 44">
          <path d="M4,2 H23 L32,11 V40 A2,2 0 0 1 30,42 H4 A2,2 0 0 1 2,40 V4 A2,2 0 0 1 4,2 Z" fill="#5b8be0"/>
          <polygon points="23,2 23,11 32,11" fill="#a8c4f5"/>
          <line x1="8" y1="19" x2="26" y2="19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="8" y1="26" x2="26" y2="26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="8" y1="33" x2="20" y2="33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <svg class="arrow-icon anim-item" viewBox="0 0 70 24">
          <line x1="8" y1="12" x2="62" y2="12" stroke="#1f2326" stroke-width="4" stroke-linecap="round"/>
          <polyline points="16,4 6,12 16,20" fill="none" stroke="#1f2326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="54,4 64,12 54,20" fill="none" stroke="#1f2326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- NODO B -->
      <div class="node-column node-b">
        <div class="hexagon-wrapper anim-item" onclick="playNodeTone(659.25)">
          <svg class="hexagon-bg" viewBox="0 0 240 270">
            <polygon class="hex-stroke"
                     points="120,8 228,70 228,200 120,262 12,200 12,70"
                     fill="#ffffff"
                     stroke="#d98a3c"
                     stroke-width="8"
                     stroke-linejoin="round" />
          </svg>
          <div class="node-content">
            <svg class="server-icon" viewBox="0 0 64 82">
              <rect x="4" y="2" width="56" height="78" rx="6" fill="#636b70"/>
              <rect x="11" y="10" width="42" height="14" rx="2" fill="#464d52"/>
              <line x1="15" y1="17" x2="49" y2="17" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
              <rect x="11" y="29" width="42" height="14" rx="2" fill="#464d52"/>
              <line x1="15" y1="36" x2="49" y2="36" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
              <circle class="led-dot" cx="32" cy="61" r="6" fill="#4ade38"/>
            </svg>
            <div class="node-label">NODO B</div>
          </div>
        </div>
        <div class="desc-box box-b anim-item">
          <strong>NODO B:</strong>
          <span>INTERMEDIARIO /<br>RETRASMISION</span>
        </div>
      </div>

      <!-- CONECTOR 2 -->
      <div class="connector conn-2">
        <svg class="doc-icon anim-item" viewBox="0 0 36 44">
          <path d="M4,2 H23 L32,11 V40 A2,2 0 0 1 30,42 H4 A2,2 0 0 1 2,40 V4 A2,2 0 0 1 4,2 Z" fill="#3a9e46"/>
          <polygon points="23,2 23,11 32,11" fill="#9be0a4"/>
          <line x1="8" y1="19" x2="26" y2="19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="8" y1="26" x2="26" y2="26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="8" y1="33" x2="20" y2="33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <svg class="arrow-icon anim-item" viewBox="0 0 70 24">
          <line x1="8" y1="12" x2="62" y2="12" stroke="#1f2326" stroke-width="4" stroke-linecap="round"/>
          <polyline points="16,4 6,12 16,20" fill="none" stroke="#1f2326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="54,4 64,12 54,20" fill="none" stroke="#1f2326" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- NODO C -->
      <div class="node-column node-c">
        <div class="hexagon-wrapper anim-item" onclick="playNodeTone(783.99)">
          <svg class="hexagon-bg" viewBox="0 0 240 270">
            <polygon class="hex-stroke"
                     points="120,8 228,70 228,200 120,262 12,200 12,70"
                     fill="#ffffff"
                     stroke="#3a9e46"
                     stroke-width="8"
                     stroke-linejoin="round" />
          </svg>
          <div class="node-content">
            <svg class="server-icon" viewBox="0 0 64 82">
              <rect x="4" y="2" width="56" height="78" rx="6" fill="#636b70"/>
              <rect x="11" y="10" width="42" height="14" rx="2" fill="#464d52"/>
              <line x1="15" y1="17" x2="49" y2="17" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
              <rect x="11" y="29" width="42" height="14" rx="2" fill="#464d52"/>
              <line x1="15" y1="36" x2="49" y2="36" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
              <circle class="led-dot" cx="32" cy="61" r="6" fill="#4ade38"/>
            </svg>
            <div class="node-label">NODO C</div>
          </div>
        </div>
        <div class="desc-box box-c anim-item">
          <strong>NODO C:</strong>
          <span>DESTINO /<br>RECEPTOR</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    let audioCtx = null;
    let timers = [];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 1. Sonido de impacto cinemático para el título
    function playTitleBoom() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.45);

      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.52);
    }

    // 2. Acorde tecnológico de activación de cada Nodo
    function playNodeTone(freq) {
      initAudio();
      const now = audioCtx.currentTime;

      [freq, freq * 1.5].forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = idx === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(f * 0.85, now);
        osc.frequency.exponentialRampToValueAtTime(f, now + 0.08);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(idx === 0 ? 0.22 : 0.1, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.58);
      });
    }

    // 3. Efecto "Whoosh" de transmisión de paquete de datos
    function playDataWhoosh() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(1180, now + 0.22);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.16, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    }

    // 4. Fanfarria corta de conexión completada (Nodo C recibido)
    function playSuccessChord() {
      initAudio();
      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50]; // Do - Mi - Sol - Do alto
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        const start = now + i * 0.07;
        osc.frequency.setValueAtTime(freq, start);

        gain.gain.setValueAtTime(0.001, start);
        gain.gain.linearRampToValueAtTime(0.15, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.7);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.75);
      });
    }

    function startSequence(withSound = true) {
      const scene = document.getElementById('scene');
      timers.forEach(t => clearTimeout(t));
      timers = [];

      // Reinicia animaciones CSS
      scene.classList.remove('play');
      void scene.offsetWidth; // Fuerza reflow
      scene.classList.add('play');

      if (!withSound) return;

      // Sincronización exacta entre animación visual y sonidos
      playTitleBoom();
      timers.push(setTimeout(() => playNodeTone(523.25), 550));   // Nodo A (Do5)
      timers.push(setTimeout(() => playDataWhoosh(), 1250));     // Paquete 1 viaja
      timers.push(setTimeout(() => playNodeTone(659.25), 1650));   // Nodo B (Mi5)
      timers.push(setTimeout(() => playDataWhoosh(), 2350));     // Paquete 2 viaja
      timers.push(setTimeout(() => playNodeTone(783.99), 2750));   // Nodo C (Sol5)
      timers.push(setTimeout(() => playSuccessChord(), 3250));   // Conexión exitosa
    }

    document.getElementById('replayBtn').addEventListener('click', () => {
      startSequence(true);
    });

    // Inicia la animación visual automáticamente al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      startSequence(false);
    });
  </script>
</body>
</html>
